name: PR title
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
permissions: {}
jobs:
  # Squash merges make the title the commit that semantic-release reads.
  title:
    runs-on: ubuntu-latest
    steps:
      - name: Check it is a Conventional Commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! printf '%s' "$TITLE" | grep -Eq '^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert|style)(\([a-z0-9._/-]+\))?!?: .+'; then
            echo "::error::PR title must be a Conventional Commit, e.g. 'fix(run): ...'"
            exit 1
          fi
