name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # FFmpeg is the slow part; the cache keeps it to the first run.
      - name: Vet and test
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          cache-from: type=gha
